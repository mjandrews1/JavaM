name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Smoke suite (all *Smoke)
        env:
          CORPUS: ${{ github.workspace }}/tests/conformance.json
        run: make smoke

      - name: Integration (SqlStore itest)
        env:
          CORPUS: ${{ github.workspace }}/tests/conformance.json
        run: make itest

      - name: Corpus runner
        env:
          CORPUS: ${{ github.workspace }}/tests/conformance.json
        run: make run

      - name: Native mJVM score
        env:
          CORPUS: ${{ github.workspace }}/tests/conformance.json
        run: |
          java -cp "build:lib/sqlite-jdbc.jar:lib/slf4j-api.jar:lib/slf4j-nop.jar" \
            jvmumps.MjvmNativeScore "$CORPUS" | tee native-score.txt
          grep -q 'MATCH=135' native-score.txt
          grep -q 'ERR=0' native-score.txt

      - name: REPL smoke (scripted)
        run: |
          printf 'W "ok",!\nS X=5 W X,!\n/quit\n' | \
            java -cp "build:lib/sqlite-jdbc.jar:lib/slf4j-api.jar:lib/slf4j-nop.jar" \
            jvmumps.Repl | grep -q 'ok'
          printf 'W "ok",!\nS X=5 W X,!\n/quit\n' | \
            java -cp "build:lib/sqlite-jdbc.jar:lib/slf4j-api.jar:lib/slf4j-nop.jar" \
            mjvm.cli.Repl | grep -q 'ok'


      - name: Dependency advisory (OSV)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, sys
          pkgs = [
            ("org.xerial:sqlite-jdbc", "3.45.1.0"),
            ("org.slf4j:slf4j-api", "2.0.13"),
            ("org.slf4j:slf4j-nop", "2.0.13"),
          ]
          bad = 0
          for name, ver in pkgs:
              body = json.dumps({"package": {"ecosystem": "Maven", "name": name}, "version": ver}).encode()
              req = urllib.request.Request("https://api.osv.dev/v1/query", data=body,
                  headers={"Content-Type": "application/json", "User-Agent": "javam-ci/0.1"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  vulns = json.loads(r.read().decode()).get("vulns") or []
              print(f"{{name}} {{ver}}: {{len(vulns)}} vulns")
              for v in vulns:
                  print(" ", v.get("id"), (v.get("summary") or "")[:80])
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

      - name: FmJv smoke
        run: |
          java -cp "build:lib/sqlite-jdbc.jar:lib/slf4j-api.jar:lib/slf4j-nop.jar" jvmumps.FmJv
